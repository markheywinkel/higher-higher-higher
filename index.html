<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher, higher, higher</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        line-height: 0;
        width: min(80vw, 142.22vh);
        aspect-ratio: 16 / 9;
      }
      canvas {
        image-rendering: pixelated;
      }
      #editor-link {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 10;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #ccc;
        background: #1e1e2eaa;
        padding: 6px 12px;
        border-radius: 6px;
        text-decoration: none;
        border: 1px solid #3a3a4a;
      }
      #editor-link:hover {
        background: #2a2a3a;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a id="editor-link" href="/editor.html">🛠 Level-Editor</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
